[package]
name = "copilot-openai-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "OpenAI-compatible chat completions API backed by the GitHub Copilot SDK"
repository = "https://github.com/darrell/copilot-api"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
github-copilot-sdk = "1"
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# The SDK's build script uses native TLS in a separately resolved dependency graph.
openssl = { version = "0.10", features = ["vendored"] }